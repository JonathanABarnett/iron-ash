name: Deploy steam branch → /next/

on:
  push:
    branches: [steam]
  workflow_dispatch:

permissions:
  contents: write   # peaceiris needs write to push to gh-pages branch

concurrency:
  group: pages-steam
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to gh-pages (/next/ — steam branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: next   # deploys under /iron-ash/next/
          keep_files: true        # preserves v1 at root
          commit_message: "deploy: steam@${{ github.sha }} → /next/"
